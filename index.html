<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kVER - Top 10 Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header id="main-header">
        <div class="logo-container" id="logo" style="cursor: pointer;">
            <h1>kVER <span>España</span></h1>
        </div>
        
        <div class="search-container">
            <div style="position: relative; width: 100%;">
                <input type="text" id="search-input" placeholder="Buscar película o serie..." autocomplete="off">
                <div id="search-suggestions" class="suggestions-box hidden"></div>
            </div>
            <button id="search-btn" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <main>
        <nav class="selectors" aria-label="Selector de plataformas de streaming">
            <div class="platform-buttons">
                <button class="btn-platform" data-id="8" data-name="Netflix">Netflix</button>
                <button class="btn-platform" data-id="337" data-name="Disney+">Disney+</button>
                <button class="btn-platform" data-id="119" data-name="Prime Video">Prime Video</button>
                <button class="btn-platform" data-id="1899" data-name="Max">Max</button>
            </div>

            <div class="random-zone">
                <button id="btn-random" class="btn-special">
                    <i class="fa-solid fa-shuffle"></i> ¡Sorpréndeme!
                </button>
            </div>
        </nav>

        <section class="hero" id="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="trending-badge"><i class="fa-solid fa-fire"></i> Top 1 en Tendencias Hoy</span>
                <h2 id="hero-title">Cargando estreno...</h2>
                <p id="hero-overview">Buscando la película más popular del momento...</p>
                <div class="hero-buttons">
                    <button id="btn-trailer" class="btn-hero-primary"><i class="fa-solid fa-play"></i> Ver Tráiler</button>
                    <button id="btn-info" class="btn-hero-secondary"><i class="fa-solid fa-circle-info"></i> Más info</button>
                </div>
            </div>
        </section>

        <section id="random-section" class="hidden">
            <div class="view-header">
                <h2>Tu Recomendación</h2>
                <button class="btn-outline btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</button>
            </div>

            <div class="random-split-layout">
                <div class="random-showcase" id="random-showcase-container">
                    <div class="empty-state"><h3>Buscando algo épico...</h3></div>
                </div>

                <aside class="random-sidebar">
                    <h3><i class="fa-solid fa-compass"></i> Sigue explorando</h3>
                    <p class="sidebar-desc">Filtra nuestro catálogo y encuentra exactamente lo que buscas.</p>
                    
                    <div class="filter-form">
                        <div class="filter-group">
                            <label for="genre-select">Género:</label>
                            <select id="genre-select">
                                <option value="">Todos los géneros</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="year-start">Año desde:</label>
                            <input type="number" id="year-start" placeholder="Ej: 1990" min="1900" max="2026">
                        </div>
                        <div class="filter-group">
                            <label for="year-end">Año hasta:</label>
                            <input type="number" id="year-end" placeholder="Ej: 2026" min="1900" max="2026">
                        </div>
                        <button id="btn-aplicar-filtros" class="btn-sidebar-filter"><i class="fa-solid fa-filter"></i> Generar Lista</button>
                    </div>
                </aside>
            </div>
        </section>

        <section id="explore-section" class="hidden">
            <div class="view-header">
                <h2 id="view-title">Resultados</h2>
                <button class="btn-outline btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</button>
            </div>

            <div id="results-container" aria-live="polite">
                </div>
        </section>
    </main>

    <footer>
        <p>Datos proporcionados por la API de <span>TMDB</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
